<!DOCTYPE html>
<html>
<head>
    <title>Firebase Auth + Firestore Example</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Firebase Auth + Firestore Example</h1>

    <!-- Auth Forms -->
    <div id="auth-forms">
        <div id="login-form">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-error" class="error hidden"></p>
        </div>

        <div id="signup-form">
            <h2>Sign Up</h2>
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <button onclick="signup()">Sign Up</button>
            <p id="signup-error" class="error hidden"></p>
        </div>

        <button onclick="googleSignIn()">Sign In with Google</button>
    </div>

    <!-- App Content (Hidden until logged in) -->
    <div id="app-content" class="hidden">
        <h2>Welcome, <span id="user-email"></span>!</h2>
        <button onclick="logout()">Logout</button>

        <h3>Your Data:</h3>
        <textarea id="data-input" placeholder="Enter your JSON data"></textarea>
        <button onclick="saveData()">Save Data</button>
        <pre id="data-output"></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
