project_id = "ps-checklist-beta"

[api]
enabled = true
port = 54321
schemas = ["public", "user_data", "catalog", "archive"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

# Large files use R2. Supabase's separate object-storage service is not needed.
[storage]
enabled = false

[auth]
site_url = "http://127.0.0.1:8001"
additional_redirect_urls = ["http://127.0.0.1:8001/**", "https://arnold.dream.ddns-ip.net/absproxy/8001/**"]

# Local development accounts can sign in immediately. Hosted provider settings
# are configured separately; this does not change any hosted Supabase project.
[auth.email]
enable_confirmations = false
